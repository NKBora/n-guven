name: AI Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/text-ai/**"
      - "ml/evaluation/**"
      - ".github/workflows/ai-validation.yml"
  push:
    branches: [main]
    paths:
      - "services/text-ai/**"
      - "ml/evaluation/**"
      - ".github/workflows/ai-validation.yml"

permissions:
  contents: read

concurrency:
  group: ai-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python, training, calibration and comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/text-ai/pyproject.toml
            ml/evaluation/pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./services/text-ai[dev]" -e "./ml/evaluation[dev]"

      - name: Test text AI service contracts
        working-directory: services/text-ai
        run: python -m pytest

      - name: Test dataset integrity and preprocessing pipeline
        working-directory: ml/evaluation
        run: |
          python -m pytest \
            tests/test_dataset_inputs.py \
            tests/test_integrity.py \
            tests/test_preprocessing.py \
            tests/test_offline_preprocessing.py \
            tests/test_preprocessing_pipeline.py

      - name: Test evaluation and splitting contracts
        working-directory: ml/evaluation
        run: |
          python -m pytest \
            tests/test_evaluation.py \
            tests/test_manifests.py \
            tests/test_splitting.py

      - name: Test model adapter and offline prediction contracts
        working-directory: ml/evaluation
        run: |
          python -m pytest \
            tests/test_model_artifacts.py \
            tests/test_model_adapters.py \
            tests/test_offline_predictions.py \
            tests/test_transformers_backend.py

      - name: Test image model security contracts
        working-directory: ml/evaluation
        run: |
          python -m pytest \
            tests/test_image_dataset_inputs.py \
            tests/test_image_preprocessing.py \
            tests/test_image_model_adapters.py \
            tests/test_image_benchmark.py \
            tests/test_image_benchmark_materialization.py \
            tests/test_image_transformers_backend.py

      - name: Test fine-tuning and comparison readiness contracts
        working-directory: ml/evaluation
        run: |
          python -m pytest \
            tests/test_finetuning.py \
            tests/test_model_packaging.py \
            tests/test_comparison.py

      - name: Test benchmark, experiments, training and calibration contracts
        working-directory: ml/evaluation
        run: |
          python -m pytest \
            tests/test_benchmark.py \
            tests/test_experiments.py \
            tests/test_training.py \
            tests/test_calibration.py

      - name: Verify AI pipeline CLI registration
        run: |
          nguven-eval validate-input --help >/dev/null
          nguven-eval validate-image-input --help >/dev/null
          nguven-eval preprocess-image --help >/dev/null
          nguven-eval validate-image-candidates --help >/dev/null
          nguven-eval validate-image-benchmark --help >/dev/null
          nguven-eval materialize-image-model --help >/dev/null
          nguven-eval verify-image-model --help >/dev/null
          nguven-eval materialize-image-benchmark --help >/dev/null
          nguven-eval verify-content-hashes --help >/dev/null
          nguven-eval preprocess-text --help >/dev/null
          nguven-eval predict-text --help >/dev/null
          nguven-eval create-finetuning-plan --help >/dev/null
          nguven-eval prepare-finetuning-data --help >/dev/null
          nguven-eval package-finetuned-model --help >/dev/null
          nguven-eval compare-models --help >/dev/null
          nguven-eval validate-benchmark --help >/dev/null
          nguven-eval validate-experiment --help >/dev/null
          nguven-eval validate-experiment-pair --help >/dev/null
          nguven-eval train-text-model --help >/dev/null
          nguven-eval fit-temperature-calibration --help >/dev/null

      - name: Verify local ML artifacts stay untracked
        run: |
          git check-ignore --quiet --no-index ml/evaluation/inputs/private-dataset.jsonl
          git check-ignore --quiet --no-index ml/evaluation/preprocessed/private-run.jsonl
          git check-ignore --quiet --no-index ml/evaluation/predictions/private-run.jsonl
          git check-ignore --quiet --no-index ml/evaluation/models/artifacts/model.safetensors
          git check-ignore --quiet --no-index ml/evaluation/models/cache/tokenizer.json
          git check-ignore --quiet --no-index ml/evaluation/finetuning/runs/private-run/training/train.jsonl
          git check-ignore --quiet --no-index ml/evaluation/comparisons/reports/private-run.json
          git check-ignore --quiet --no-index ml/evaluation/calibration/runs/private-run.json

  container:
    name: Packaged BERTurk runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build CPU-only BERTurk service image
        run: docker build --tag nguven-text-ai:test services/text-ai

      - name: Verify configured runtime user
        run: |
          runtime_user="$(docker image inspect nguven-text-ai:test --format '{{.Config.User}}')"
          test -n "$runtime_user"
          test "$runtime_user" != "0"
          test "$runtime_user" != "root"

      - name: Verify offline inference runtime and release registry
        run: |
          docker run --rm --entrypoint python nguven-text-ai:test -c '
          import importlib.metadata
          import os
          from app.inference.berturk import DEFAULT_RELEASE_PATH

          assert importlib.metadata.version("torch")
          assert importlib.metadata.version("transformers")
          assert importlib.metadata.version("safetensors")
          assert os.environ["HF_HUB_OFFLINE"] == "1"
          assert os.environ["TRANSFORMERS_OFFLINE"] == "1"
          assert DEFAULT_RELEASE_PATH.is_file()
          '

      - name: Verify safe startup without mounted weights
        run: |
          docker run --rm --entrypoint python nguven-text-ai:test -c '
          import asyncio
          from app.inference.service import NotConfiguredTextInferenceService, get_text_inference_service
          from app.main import health

          assert isinstance(get_text_inference_service(), NotConfiguredTextInferenceService)
          assert asyncio.run(health()).status == "ok"
          '
