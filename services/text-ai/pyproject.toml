[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nguven-text-ai"
version = "0.2.0"
description = "N-Güven Turkish text AI service foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
inference = [
  "safetensors>=0.5,<1",
  "torch>=2.4,<3",
  "transformers>=4.57,<5",
]
dev = [
  "httpx2>=2.12,<3",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
