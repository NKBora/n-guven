[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nguven-evaluation"
version = "0.1.0"
description = "Reproducible evaluation tooling for N-Güven ML services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
inference = [
  "huggingface-hub>=0.28,<1",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
]
training = [
  "accelerate>=1.2,<2",
  "numpy>=2,<3",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
]
materialization = [
  "pyarrow>=19,<22",
]

[project.scripts]
nguven-eval = "nguven_evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nguven_evaluation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
